name: quest-apk
# Builds the Quest APK (arm64, debug-signed) from this branch. Runs on demand from the Actions tab,
# and on pushes to quest1-notes that touch code.
on:
  workflow_dispatch:
  push:
    branches: [quest1-notes]
    paths-ignore:
      - '**.md'
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Install NDK and CMake
      # Versions pinned by Android/app/build.gradle (ndkVersion, cmake version).
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5"
    - name: Set up ccache
      # Native compile is ~30 of the ~32 minutes. ccache keeps compiled objects between runs, so a
      # run only recompiles what changed. CMake (3.17+) picks the launcher up from the environment.
      # The NDK is reinstalled every run, so compilers are matched by content, not timestamp.
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q ccache
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-quest-apk-${{ github.sha }}
        restore-keys: ccache-quest-apk-
    - name: Build soh.o2r and bundle it in the APK
      # The game can't start without soh.o2r (the port's own assets: shaders, fonts, custom models).
      # The ROM extractor on the headset only makes oot.o2r/oot-mq.o2r; MainActivity copies
      # assets/soh.o2r out of the APK on first launch. Without it a fresh install hangs at loading.
      # Built with the desktop toolchain (ZAPD) from this commit, so it always matches the build.
      # BUILD_REMOTE_CONTROL=1 makes CMake look up SDL2_net, which the Linux link list always needs.
      run: |
        sudo apt-get install -y -q $(cat linux-build-deps/apt.txt)
        cmake --no-warn-unused-cli -H. -Bbuild-host -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-host --target GenerateSohOtr -j4
        mkdir -p Android/app/src/main/assets
        cp soh.o2r Android/app/src/main/assets/soh.o2r
        ls -l Android/app/src/main/assets/soh.o2r
    - name: Quest 1 and 2 manifest
      # The Quest 1 runtime aborts on device names it doesn't know (quest3, quest3s, questpro), so
      # this build lists only the ones it understands.
      run: |
        sed -i 's|android:name="com.oculus.supportedDevices" android:value="[^"]*"|android:name="com.oculus.supportedDevices" android:value="quest\|quest2"|' Android/app/src/main/AndroidManifest.xml
        grep -n 'com.oculus.supportedDevices' Android/app/src/main/AndroidManifest.xml
    - name: Build APK (Quest 1 and 2)
      working-directory: Android
      env:
        GIT_TAG: ${{ github.ref_name }}-${{ github.run_number }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    - name: Upload APK (Quest 1 and 2)
      uses: actions/upload-artifact@v4
      with:
        name: quest1-oot-vr-${{ github.ref_name }}-${{ github.run_number }}
        path: Android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: ccache stats
      run: ccache --show-stats
    - name: Quest 3, 3S and Pro manifest
      # Same code; only the device list differs. Gradle should only redo the manifest and packaging
      # steps, and signs with the same debug key as the first APK of this run.
      run: |
        rm -f Android/app/build/outputs/apk/debug/*.apk
        sed -i 's|android:name="com.oculus.supportedDevices" android:value="[^"]*"|android:name="com.oculus.supportedDevices" android:value="quest3\|quest3s\|questpro"|' Android/app/src/main/AndroidManifest.xml
        grep -n 'com.oculus.supportedDevices' Android/app/src/main/AndroidManifest.xml
    - name: Build APK (Quest 3, 3S and Pro)
      working-directory: Android
      env:
        GIT_TAG: ${{ github.ref_name }}-${{ github.run_number }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    - name: Upload APK (Quest 3, 3S and Pro)
      uses: actions/upload-artifact@v4
      with:
        name: quest3-oot-vr-${{ github.ref_name }}-${{ github.run_number }}
        path: Android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
