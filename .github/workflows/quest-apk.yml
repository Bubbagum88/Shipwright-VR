name: quest-apk
# Test only: builds ChocoTorp's quest3-standalone exactly as published (no fixes), to confirm whether
# a fresh clone builds. --continue so every failing task is reported, not just the first.
on:
  workflow_dispatch:
  push:
    branches: [ci/upstream-build-check]
    paths-ignore:
      - '**.md'
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Install NDK and CMake
      # Versions pinned by Android/app/build.gradle (ndkVersion, cmake version).
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5"
    - name: Allow Quest 1 in the manifest
      # The Quest 1 runtime aborts on device names it doesn't know (quest3, quest3s, questpro), so
      # the build lists only the ones it understands.
      run: |
        sed -i 's|android:name="com.oculus.supportedDevices" android:value="[^"]*"|android:name="com.oculus.supportedDevices" android:value="quest\|quest2"|' Android/app/src/main/AndroidManifest.xml
        grep -n 'com.oculus.supportedDevices' Android/app/src/main/AndroidManifest.xml
    - name: Build APK
      working-directory: Android
      env:
        GIT_TAG: ${{ github.ref_name }}-${{ github.run_number }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace --continue
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quest1-oot-vr-${{ github.ref_name }}-${{ github.run_number }}
        path: Android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
